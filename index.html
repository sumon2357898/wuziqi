<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>五子棋 - 人机对战</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px 10px;
    }
    h1 { margin-bottom: 10px; color: #333; font-size: 24px; }
    .info {
      margin-bottom: 15px;
      font-size: 18px;
      font-weight: bold;
      color: #222;
    }
    #board {
      display: grid;
      grid-template-columns: repeat(15, 1fr);
      gap: 0;
      background: #e3c18a;
      border: 3px solid #8b5a2b;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      width: min(95vw, 450px);
      height: min(95vw, 450px);
    }
    .cell {
      aspect-ratio: 1;
      border: 1px solid #b08968;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
    }
    .cell::before {
      content: '';
      width: 70%;
      height: 70%;
      border-radius: 50%;
      position: absolute;
    }
    .black::before { background: #111; box-shadow: 1px 1px 3px rgba(0,0,0,0.5); }
    .white::before { background: #fff; box-shadow: 1px 1px 3px rgba(0,0,0,0.3); border: 1px solid #ccc; }
    .controls {
      margin-top: 20px;
      display: flex;
      gap: 12px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #4a90e2;
      color: white;
      cursor: pointer;
    }
    button:active { background: #357abd; }
    .tip { margin-top: 15px; color: #666; font-size: 14px; text-align: center; }
  </style>
</head>
<body>
  <h1>五子棋 · 人机对战</h1>
  <div class="info" id="status">轮到你下（黑棋）</div>
  
  <div id="board"></div>
  
  <div class="controls">
    <button onclick="restart()">重新开始</button>
  </div>
  <div class="tip">你是黑棋，先手。点击棋盘落子</div>

  <script>
    const SIZE = 15;
    let board = Array(SIZE).fill().map(() => Array(SIZE).fill(0));
    let currentPlayer = 1; // 1=黑(人) 2=白(AI)
    let gameOver = false;

    const boardEl = document.getElementById('board');
    const statusEl = document.getElementById('status');

    // 创建棋盘
    function createBoard() {
      boardEl.innerHTML = '';
      for (let i = 0; i < SIZE; i++) {
        for (let j = 0; j < SIZE; j++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.dataset.row = i;
          cell.dataset.col = j;
          cell.onclick = () => handleClick(i, j);
          boardEl.appendChild(cell);
        }
      }
    }

    function handleClick(row, col) {
      if (gameOver || board[row][col] !== 0 || currentPlayer !== 1) return;
      
      placeStone(row, col, 1);
      if (checkWin(row, col, 1)) {
        statusEl.textContent = '🎉 你赢了！';
        gameOver = true;
        return;
      }
      
      currentPlayer = 2;
      statusEl.textContent = 'AI 思考中...';
      
      setTimeout(() => {
        aiMove();
      }, 300);
    }

    function placeStone(row, col, player) {
      board[row][col] = player;
      const cell = boardEl.children[row * SIZE + col];
      cell.classList.add(player === 1 ? 'black' : 'white');
    }

    // 简单AI：优先防守 + 随机进攻
    function aiMove() {
      if (gameOver) return;
      
      // 1. 检查是否能直接获胜
      for (let i = 0; i < SIZE; i++) {
        for (let j = 0; j < SIZE; j++) {
          if (board[i][j] === 0) {
            board[i][j] = 2;
            if (checkWin(i, j, 2)) {
              placeStone(i, j, 2);
              statusEl.textContent = 'AI 赢了 😢';
              gameOver = true;
              return;
            }
            board[i][j] = 0;
          }
        }
      }
      
      // 2. 检查是否需要防守（阻止玩家获胜）
      for (let i = 0; i < SIZE; i++) {
        for (let j = 0; j < SIZE; j++) {
          if (board[i][j] === 0) {
            board[i][j] = 1;
            if (checkWin(i, j, 1)) {
              board[i][j] = 0;
              placeStone(i, j, 2);
              currentPlayer = 1;
              statusEl.textContent = '轮到你下（黑棋）';
              return;
            }
            board[i][j] = 0;
          }
        }
      }
      
      // 3. 随便找一个空位下
      let empty = [];
      for (let i = 0; i < SIZE; i++) {
        for (let j = 0; j < SIZE; j++) {
          if (board[i][j] === 0) empty.push([i, j]);
        }
      }
      if (empty.length > 0) {
        const [r, c] = empty[Math.floor(Math.random() * empty.length)];
        placeStone(r, c, 2);
      }
      
      currentPlayer = 1;
      statusEl.textContent = '轮到你下（黑棋）';
    }

    function checkWin(row, col, player) {
      const dirs = [[1,0], [0,1], [1,1], [1,-1]];
      for (let [dx, dy] of dirs) {
        let count = 1;
        // 正方向
        for (let k = 1; k < 5; k++) {
          const x = row + dx * k, y = col + dy * k;
          if (x < 0 || x >= SIZE || y < 0 || y >= SIZE || board[x][y] !== player) break;
          count++;
        }
        // 反方向
        for (let k = 1; k < 5; k++) {
          const x = row - dx * k, y = col - dy * k;
          if (x < 0 || x >= SIZE || y < 0 || y >= SIZE || board[x][y] !== player) break;
          count++;
        }
        if (count >= 5) return true;
      }
      return false;
    }

    function restart() {
      board = Array(SIZE).fill().map(() => Array(SIZE).fill(0));
      currentPlayer = 1;
      gameOver = false;
      statusEl.textContent = '轮到你下（黑棋）';
      createBoard();
    }

    // 初始化
    createBoard();
  </script>
</body>
</html>
